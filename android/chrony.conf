# chronyd on an SDV Media device (vendor/sdv-everyware/third_party/chrony).

# Android's own NTP servers (the framework uses time.android.com). Not mixed with other
# servers: Google smears leap seconds, other pools do not.
pool time.android.com iburst maxsources 4

# The board has no RTC battery and boots at 1970-01-01: step the clock on the first
# updates instead of slewing for weeks. Later corrections are slewed only.
makestep 1 3

# Let the kernel copy the system time to the RTC every 11 minutes.
rtcsync

driftfile /data/misc/chrony/drift

# The user chronyd runs as (chronyd.rc: user system, CAP_SYS_TIME). chronyd checks that its
# socket directory belongs to this user; it drops privileges only when started as root.
user system

# chronyc over the Unix socket only, no UDP command port.
cmdport 0
